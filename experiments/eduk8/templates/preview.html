<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link href="/experiments/eduk8/static/css/style.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        /* Theme Colors */
        .theme-indigo .active-nav { border-left-color: #6366F1; color: #4338CA; background: white; }
        .theme-sky .active-nav { border-left-color: #0EA5E9; color: #0369A1; background: white; }
        .theme-stone .active-nav { border-left-color: #D97706; color: #92400E; background: white; }
        .theme-emerald .active-nav { border-left-color: #10B981; color: #065F46; background: white; }
        .theme-blue .active-nav { border-left-color: #3B82F6; color: #1E40AF; background: white; }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden bg-slate-50">

    <div id="loading" class="fixed inset-0 bg-white z-50 flex items-center justify-center">
        <div class="text-center">
            <div class="inline-block w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-slate-500">Loading Preview...</p>
        </div>
    </div>

    <!-- Sidebar -->
    <aside class="w-full md:w-72 bg-white border-r border-slate-200 flex-shrink-0 flex flex-col h-auto md:h-full overflow-y-auto z-20 hidden" id="sidebar">
        <div class="p-6 border-b border-slate-200 bg-slate-50 sticky top-0">
            <h1 class="text-xl font-bold text-slate-800 tracking-tight flex items-center">
                <span class="bg-yellow-100 text-yellow-800 text-xs font-bold px-2 py-1 rounded mr-2 uppercase">Preview</span>
                <span id="course-title">Loading...</span>
            </h1>
            <p class="text-xs text-slate-500 mt-2 font-semibold uppercase tracking-wider" id="course-subtitle"></p>
        </div>
        
        <nav class="flex-grow p-4 space-y-2 text-sm text-slate-600" id="nav-container">
            <!-- Nav items injected here -->
        </nav>
        
        <div class="p-4 border-t border-slate-200">
            <button onclick="window.close()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-2 rounded text-sm transition-colors">
                Close Preview
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-4 md:p-8 relative hidden" id="main-content">
        <!-- Content injected via JS -->
    </main>

    <!-- Initialize from LocalStorage -->
    <script>
        // Placeholder for app.js to use
        let COURSE_DATA = null;

        document.addEventListener('DOMContentLoaded', () => {
            try {
                const rawData = localStorage.getItem('eduk8_preview_module');
                if (!rawData) {
                    throw new Error("No preview data found.");
                }
                
                COURSE_DATA = JSON.parse(rawData);
                
                // Initialize UI
                document.body.classList.add(`theme-${COURSE_DATA.theme || 'indigo'}`);
                document.getElementById('course-title').innerText = COURSE_DATA.title;
                document.getElementById('course-subtitle').innerText = COURSE_DATA.subtitle;
                
                // Render Nav
                const navContainer = document.getElementById('nav-container');
                COURSE_DATA.navigation.forEach(item => {
                    const div = document.createElement('div');
                    div.id = `nav-${item.id}`;
                    div.className = "nav-item p-3 rounded-r-lg flex items-center cursor-pointer hover:bg-slate-50 border-l-4 border-transparent transition-all";
                    div.onclick = () => navigate(item.id);
                    div.innerHTML = `
                        <i class="fas ${item.icon} w-6 text-center mr-2 opacity-70"></i> 
                        <div>
                            <div class="font-medium">${item.label}</div>
                            ${item.sub ? `<div class="text-[10px] uppercase font-bold text-slate-400">${item.sub}</div>` : ''}
                        </div>
                    `;
                    navContainer.appendChild(div);
                });

                // Show UI
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('sidebar').classList.remove('hidden');
                document.getElementById('main-content').classList.remove('hidden');

                // Navigate to first page
                if (COURSE_DATA.navigation.length > 0) {
                    navigate(COURSE_DATA.navigation[0].id);
                }

            } catch (e) {
                document.getElementById('loading').innerHTML = `
                    <div class="text-red-500 font-bold p-8 text-center">
                        <i class="fas fa-exclamation-triangle text-4xl mb-4"></i><br>
                        Error loading preview: ${e.message}
                    </div>
                `;
            }
        });
    </script>
    
    <!-- Load App Logic -->
    <script src="/experiments/eduk8/static/js/app.js"></script>
</body>
</html>
