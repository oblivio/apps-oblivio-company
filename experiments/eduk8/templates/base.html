<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ course.title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link href="/experiments/eduk8/static/css/style.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        /* Theme Colors */
        .theme-indigo .active-nav { border-left-color: #6366F1; color: #4338CA; background: white; }
        .theme-sky .active-nav { border-left-color: #0EA5E9; color: #0369A1; background: white; }
        .theme-stone .active-nav { border-left-color: #D97706; color: #92400E; background: white; } /* Amber accent for stone theme */
        .theme-emerald .active-nav { border-left-color: #10B981; color: #065F46; background: white; }
        .theme-blue .active-nav { border-left-color: #3B82F6; color: #1E40AF; background: white; }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden bg-slate-50 theme-{{ course.theme }}">

    <!-- Sidebar -->
    <aside class="w-full md:w-72 bg-white border-r border-slate-200 flex-shrink-0 flex flex-col h-auto md:h-full overflow-y-auto z-20">
        <div class="p-6 border-b border-slate-200 bg-slate-50 sticky top-0">
            <h1 class="text-xl font-bold text-slate-800 tracking-tight flex items-center">
                <a href="/experiments/eduk8/" class="hover:opacity-75 transition-opacity">
                    <i class="fas fa-chevron-left mr-2 text-xs"></i>
                </a>
                <span>{{ course.title }}</span>
            </h1>
            <p class="text-xs text-slate-500 mt-2 font-semibold uppercase tracking-wider">{{ course.subtitle }}</p>
        </div>
        
        <nav class="flex-grow p-4 space-y-2 text-sm text-slate-600">
            {% for item in course.navigation %}
            <div onclick="navigate('{{ item.id }}')" id="nav-{{ item.id }}" class="nav-item p-3 rounded-r-lg flex items-center cursor-pointer hover:bg-slate-50 border-l-4 border-transparent transition-all">
                <i class="fas {{ item.icon }} w-6 text-center mr-2 opacity-70"></i> 
                <div>
                    <div class="font-medium">{{ item.label }}</div>
                    {% if item.sub %}<div class="text-[10px] uppercase font-bold text-slate-400">{{ item.sub }}</div>{% endif %}
                </div>
            </div>
            {% endfor %}
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-4 md:p-8 relative" id="main-content">
        <!-- Content injected via JS -->
    </main>

    <!-- Pass Data to JS -->
    <script>
        const COURSE_DATA = {{ course | tojson }};
    </script>
    <script src="/experiments/eduk8/static/js/app.js"></script>
</body>
</html>
